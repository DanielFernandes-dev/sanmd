<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sim, Acredite nas Mentiras Dele kk — Protótipo V1</title>
  <link rel="stylesheet" href="styles.css?v=ir-para-minimal-v1">
</head>
<body>
  <div id="app">
    <main id="vn-area">
      <div id="scene">
        <img id="cenario" src="assets/cenario/beco/entrada.png" alt="Entrada do beco" aria-hidden="true" draggable="false">
        <img id="personagem" alt="" aria-hidden="true" draggable="false">
      </div>
      <div id="ir-para-menu" class="oculto" role="group" aria-label="Ir para"></div>
      <section id="dialogue-box" class="oculto">
        <span id="name-plate">???</span>
        <p id="dialogue-text"></p>
        <span id="continue-arrow" class="oculto">▼</span>
      </section>
    </main>

    <button id="btn-conversar" type="button" aria-label="Conversar">
        <svg class="action-icon" viewBox="0 0 32 32" width="32" height="32" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true">
          <path opacity="0.45" d="M10 4H26V6H28V17H26V19H23V22H21V19H10V17H8V6H10V4Z"/>
          <path fill-rule="evenodd" d="M6 9H22V11H24V22H22V24H14V26H12V28H10V24H6V22H4V11H6V9ZM8 15H11V18H8V15ZM14 15H17V18H14V15ZM20 15H22V18H20V15Z"/>
        </svg>
    </button>
    <button id="btn-ir-para" type="button" aria-label="Ir para">
        <svg class="action-icon" viewBox="0 0 32 32" width="32" height="32" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true">
          <path opacity="0.45" d="M4 8H13V11H4V8ZM4 21H13V24H4V21Z"/>
          <path d="M8 13H17V8H20V10H22V12H24V14H28V18H24V20H22V22H20V24H17V19H8V13Z"/>
        </svg>
    </button>
    <button id="btn-celular" type="button" aria-label="Celular">
        <svg class="action-icon" viewBox="0 0 32 32" width="32" height="32" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true">
          <path opacity="0.45" d="M23 9H26V16H23V9Z"/>
          <path fill-rule="evenodd" d="M11 3H21V5H23V7H24V27H22V29H10V27H8V7H9V5H11V3ZM11 9H21V23H11V9ZM14 6H18V7H14V6ZM15 25H17V27H15V25Z"/>
          <path opacity="0.55" d="M13 11H19V13H13V11ZM13 15H19V17H13V15ZM13 19H17V21H13V19Z"/>
        </svg>
    </button>
  </div>

  <div id="phone-overlay" class="oculto">
    <div id="phone-frame">
      <div id="phone-screen">
        <div id="status-bar">
          <span id="phone-signal">▂▄▆</span>
          <span id="reset-countdown" class="oculto" role="timer" aria-label="Tempo até o reset">01:00</span>
          <span id="clock">--:--</span>
          <span>100%</span>
        </div>
        <div id="phone-home">
          <p id="phone-date"></p>
          <div id="apps-grid">
            <button id="btn-mensagens" class="app" type="button" aria-label="Abrir Mensagens"><span class="app-icon">💬</span><span>Mensagens</span></button>
            <button id="btn-galeria" class="app" type="button" aria-label="Abrir Galeria"><span class="app-icon">🖼️</span><span>Galeria</span></button>
            <button class="app" type="button" aria-label="Notas indisponíveis" disabled><span class="app-icon">📝</span><span>Notas</span></button>
            <button id="btn-arquivos" class="app" type="button" aria-label="Abrir Arquivos"><span class="app-icon">📁</span><span>Arquivos</span></button>
          </div>
        </div>
        <section id="phone-messages" class="oculto" aria-labelledby="messages-header">
          <header id="messages-header">???</header>
          <div id="messages-list" aria-live="polite"></div>
          <div id="messages-choices" class="oculto" role="group" aria-label="Escolha uma resposta"></div>
        </section>
        <section id="phone-files" class="oculto" aria-labelledby="files-header">
          <header id="files-header">ARQUIVOS RECENTES</header>
          <div id="files-list"></div>
          <article id="file-viewer" class="oculto" aria-live="polite">
            <p id="file-type"></p>
            <h2 id="file-name"></h2>
            <p id="file-content"></p>
            <form id="identity-puzzle" class="oculto">
              <label for="identity-answer">Decodifique o pronome do remetente:</label>
              <div class="puzzle-input-row">
                <input id="identity-answer" type="text" autocomplete="off" maxlength="12">
                <button type="submit">DECODIFICAR</button>
              </div>
              <p id="identity-feedback" aria-live="polite"></p>
            </form>
          </article>
        </section>
        <section id="phone-gallery" class="oculto" aria-labelledby="gallery-header">
          <header id="gallery-header">GALERIA</header>
          <div id="gallery-toolbar">
            <span id="gallery-count">0/9</span>
            <button id="btn-tirar-foto" type="button">TIRAR FOTO</button>
          </div>
          <p id="gallery-status" role="status" aria-live="polite"></p>
          <div id="gallery-grid" aria-label="Fotografias salvas"></div>
          <form id="gallery-photo-form" class="oculto">
            <div id="gallery-preview"></div>
            <label for="gallery-photo-name">Nome da fotografia</label>
            <input id="gallery-photo-name" type="text" maxlength="28" autocomplete="off" required>
            <div class="gallery-actions">
              <button type="submit">CONFIRMAR</button>
              <button id="btn-cancelar-foto" type="button">CANCELAR</button>
            </div>
          </form>
          <article id="gallery-detail" class="oculto">
            <div id="gallery-detail-photo"></div>
            <h2 id="gallery-detail-name"></h2>
            <p id="gallery-detail-date"></p>
            <div class="gallery-actions">
              <button id="btn-carregar-foto" type="button">CARREGAR</button>
              <button id="btn-excluir-foto" type="button">EXCLUIR</button>
              <button id="btn-voltar-galeria" type="button">VOLTAR</button>
            </div>
          </article>
          <div id="gallery-flash" class="oculto" aria-hidden="true"></div>
        </section>
        <section id="phone-reset" class="oculto" role="status" aria-live="assertive">
          <p class="reset-code">REMOTE_RESET</p>
          <p id="reset-status">Conexão remota detectada...</p>
          <div class="reset-progress" aria-hidden="true"><span></span></div>
        </section>
        <div id="phone-nav">
          <button id="btn-voltar" type="button">◀ VOLTAR</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/data.js?v=ir-para"></script>
  <script src="js/save-system.js?v=save-gallery-v1"></script>
  <script src="js/game.js?v=save-gallery-v1"></script>
</body>
</html>
